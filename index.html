<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luis Quita Estrés™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#1a0808;
    --bg-darker:#100404;
    --panel:#2a0f0f;
    --mustard:#f2b705;
    --tomato:#e8432a;
    --tomato-dark:#a01f11;
    --blood:#7a0c0c;
    --ink:#120404;
    --paper:#f4e9d8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(circle at 20% 10%, #3a1010 0%, transparent 45%),
      radial-gradient(circle at 80% 90%, #3a1010 0%, transparent 45%),
      var(--bg-dark);
    font-family:'Rubik',sans-serif;
    color:var(--paper);
    overflow:hidden;
    user-select:none;
  }
  h1,h2,.impact{font-family:'Bangers',cursive;letter-spacing:1px;}

  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
  }

  /* ---------- HUD ---------- */
  #hud{
    display:flex;
    align-items:center;
    gap:18px;
    padding:8px 16px;
    background:var(--ink);
    border-bottom:4px solid var(--mustard);
    flex-wrap:wrap;
    z-index:20;
  }
  #hud h1{
    margin:0;
    font-size:26px;
    color:var(--mustard);
    text-shadow:2px 2px 0 var(--tomato-dark), -1px -1px 0 #000;
    margin-right:auto;
  }
  .stat{display:flex;flex-direction:column;min-width:110px;}
  .stat .label{font-size:10px;text-transform:uppercase;opacity:.7;letter-spacing:1px;}
  .barwrap{
    width:130px;height:14px;background:#3a1414;
    border:2px solid #000;border-radius:8px;overflow:hidden;
    box-shadow:inset 0 0 4px #000;
  }
  .barfill{height:100%;transition:width .25s ease;}
  #hpbar{background:linear-gradient(90deg,#ff4747,#ff8a3d);}
  #xpbar{background:linear-gradient(90deg,#f2b705,#fff2a0);}
  .moneytxt{font-family:'Bangers',cursive;font-size:20px;color:#8fff8f;text-shadow:1px 1px 0 #000;}
  .lvltxt{font-family:'Bangers',cursive;font-size:20px;color:var(--mustard);}

  /* ---------- STAGE ---------- */
  #stage{
    position:relative;
    flex:1;
    overflow:hidden;
    background:
      linear-gradient(to bottom, #241010 0%, #150707 70%, #0c0303 100%);
    cursor:crosshair;
  }
  #stage::before{ /* piso */
    content:"";
    position:absolute;left:0;right:0;bottom:0;height:14%;
    background:repeating-linear-gradient(90deg,#241010,#241010 40px,#2c1313 40px,#2c1313 80px);
    border-top:4px solid #000;
  }

  #windIndicator{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.55);border:2px solid var(--mustard);
    padding:4px 12px;border-radius:20px;font-size:13px;
    display:none;align-items:center;gap:6px;z-index:15;
  }

  /* ---------- BUDDY ---------- */
  #buddyWrap{
    position:absolute;
    bottom:16%;
    left:50%;
    transform:translateX(-50%);
    width:220px;height:340px;
    transition:transform .5s ease;
    z-index:5;
  }
  #buddy{position:relative;width:100%;height:100%;}
  .part{position:absolute;transition:filter .15s;}
  .head{
    width:104px;height:104px;left:58px;top:0;
    background-image:var(--avatar-img);
    background-size:cover;
    background-position:center 30%;
    border-radius:50%;
    border:4px solid #000;
    z-index:6;
  }

  .torso{
    width:150px;height:150px;left:35px;top:88px;
    background:#6b4226;
    border:4px solid #000;
    border-radius:20px;
    z-index:4;
  }
  .armL,.armR{
    width:36px;height:110px;top:95px;
    background:#6b4226;border:4px solid #000;border-radius:16px;z-index:3;
  }
  .armL{left:-14px;transform:rotate(8deg);}
  .armR{right:-14px;transform:rotate(-8deg);}
  .legL,.legR{
    width:44px;height:100px;top:222px;
    background:#20263a;border:4px solid #000;border-radius:10px;z-index:2;
  }
  .legL{left:52px;}
  .legR{right:52px;}

  .helmet{
    position:absolute;top:-18px;left:56px;width:108px;height:66px;
    background:#8a8f99;border:4px solid #000;border-radius:50% 50% 20% 20%;
    z-index:7;display:none;
  }
  .armorplate{
    position:absolute;left:30px;top:82px;width:160px;height:100px;
    background:#5a5f66;border:4px solid #000;border-radius:16px;
    z-index:4;display:none;
  }

  .fan{
    position:absolute;top:90px;width:70px;height:70px;
    z-index:8;display:none;
  }
  .fan.left{left:-110px;}
  .fan.right{right:-110px;}
  .fan .blade{
    width:100%;height:100%;border-radius:50%;
    background:
      conic-gradient(#888 0deg 20deg, transparent 20deg 90deg,
      #888 90deg 110deg, transparent 110deg 180deg,
      #888 180deg 200deg, transparent 200deg 270deg,
      #888 270deg 290deg, transparent 290deg 360deg);
    border:4px solid #000;
    animation:spin .5s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .trapdoor{
    position:absolute;bottom:-6px;left:20px;width:180px;height:20px;
    background:#3a2210;border:3px solid #000;border-radius:4px;z-index:1;
    transform-origin:left center;
  }
  .sharkzone{
    position:absolute;bottom:-60px;left:0;width:220px;height:80px;
    background:linear-gradient(#0a3d5c,#052235);
    border:3px solid #000;border-radius:6px;display:none;
    overflow:hidden;z-index:0;
  }
  .fin{
    position:absolute;bottom:20px;width:0;height:0;
    border-left:12px solid transparent;border-right:12px solid transparent;
    border-bottom:26px solid #555;
  }

  .squash{transform:translateX(-50%) scaleY(.14) translateY(120px) !important;filter:contrast(1.3);}
  .flyaway{animation:flyaway .6s ease forwards;}
  @keyframes flyaway{
    0%{transform:translateX(-50%) translateY(0) rotate(0);}
    100%{transform:translateX(-50%) translateY(-220px) translateX(120px) rotate(300deg);opacity:0;}
  }
  .sink{animation:sink .9s ease forwards;}
  @keyframes sink{
    0%{transform:translateX(-50%) translateY(0) rotate(0);opacity:1;}
    100%{transform:translateX(-50%) translateY(160px) rotate(15deg);opacity:0;}
  }
  .hitflash{filter:brightness(2) saturate(0) !important;}

  #launcher{
    position:absolute;bottom:4%;left:50%;transform:translateX(-50%);
    font-size:44px;z-index:9;filter:drop-shadow(0 4px 2px #000);
  }

  .projectile{
    position:absolute;font-size:30px;z-index:12;
    filter:drop-shadow(0 3px 2px #000);
    pointer-events:none;
  }

  .toast{
    position:absolute;
    font-family:'Bangers',cursive;
    font-size:22px;
    padding:6px 14px;
    background:var(--mustard);
    color:#1a0808;
    border:3px solid #000;
    border-radius:14px 14px 14px 2px;
    z-index:30;
    pointer-events:none;
    animation:toastpop 1.3s ease forwards;
    white-space:nowrap;
  }
  .toast.crit{background:var(--tomato);color:#fff;font-size:26px;}
  .toast.miss{background:#555;color:#ccc;}
  @keyframes toastpop{
    0%{opacity:0;transform:translateY(10px) scale(.7);}
    15%{opacity:1;transform:translateY(-10px) scale(1.05);}
    25%{transform:translateY(-14px) scale(1);}
    80%{opacity:1;}
    100%{opacity:0;transform:translateY(-50px) scale(.9);}
  }

  #centerBanner{
    position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
    font-family:'Bangers',cursive;font-size:52px;color:var(--tomato);
    text-shadow:3px 3px 0 #000, -2px -2px 0 #000;
    text-align:center;z-index:40;display:none;
    pointer-events:none;
  }
  #centerBanner .sub{
    display:block;font-family:'Rubik',sans-serif;font-size:16px;color:var(--paper);margin-top:6px;
  }

  /* ---------- TREN ---------- */
  #train{
    position:absolute;bottom:15%;left:-420px;width:380px;height:130px;
    z-index:50;display:none;
  }
  .loco-body{
    position:absolute;left:120px;bottom:20px;width:220px;height:70px;
    background:#c1272d;border:4px solid #000;border-radius:6px;
  }
  .loco-cabin{
    position:absolute;left:230px;bottom:80px;width:100px;height:55px;
    background:#8c1c21;border:4px solid #000;border-radius:6px 6px 0 0;
  }
  .loco-nose{
    position:absolute;left:10px;bottom:20px;width:130px;height:70px;
    background:#8c1c21;border:4px solid #000;border-radius:40px 10px 10px 40px;
  }
  .loco-chimney{
    position:absolute;left:60px;bottom:88px;width:22px;height:36px;
    background:#333;border:3px solid #000;border-radius:4px 4px 0 0;
  }
  .wheel{
    position:absolute;bottom:-14px;width:44px;height:44px;border-radius:50%;
    background:#222;border:4px solid #000;
    animation:rollwheel .3s linear infinite;
  }
  @keyframes rollwheel{to{transform:rotate(360deg);}}
  .w1{left:30px;}.w2{left:110px;}.w3{left:190px;}.w4{left:270px;}

  #trainRun{position:absolute;inset:0;animation:trainrun 2.6s linear forwards;}
  @keyframes trainrun{
    from{transform:translateX(0);}
    to{transform:translateX(calc(100vw + 500px));}
  }

  /* ---------- SHOP ---------- */
  #shop{
    display:flex;
    gap:10px;
    padding:10px 14px;
    background:var(--ink);
    border-top:4px solid var(--mustard);
    overflow-x:auto;
    z-index:20;
  }
  .wcard{
    flex:0 0 auto;
    width:108px;
    background:var(--panel);
    border:3px solid #000;
    border-radius:10px;
    padding:8px 6px;
    text-align:center;
    cursor:pointer;
    transition:transform .1s;
    position:relative;
  }
  .wcard:hover{transform:translateY(-3px);}
  .wcard.selected{border-color:var(--mustard);box-shadow:0 0 0 2px var(--mustard);}
  .wcard.locked{opacity:.45;cursor:not-allowed;}
  .wcard .wemoji{font-size:30px;}
  .wcard .wname{font-size:11px;font-weight:600;margin-top:2px;}
  .wcard .wprice{font-size:11px;color:var(--mustard);margin-top:2px;}
  .wcard .wlock{font-size:10px;color:#ff8a8a;margin-top:2px;}

  /* boton invisible tren */
  #secretBtn{
    position:fixed;
    bottom:96px;right:4px;
    width:90px;height:90px;
    background:transparent;
    border:none;
    z-index:100;
    cursor:default;
    padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  @media (max-width:640px){
    #secretBtn{ bottom:110px; width:80px; height:80px; }
  }

  @media (prefers-reduced-motion: reduce){
    .fan .blade{animation:none;}
    .wheel{animation:none;}
    #trainRun{animation-duration:4.2s;}
  }

  @media (max-width:640px){
    #hud h1{font-size:18px;}
    .barwrap{width:90px;}
    #buddyWrap{transform:translateX(-50%) scale(.8);}
  }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <h1>💀 LUIS QUITA ESTRÉS™</h1>
    <div class="stat">
      <span class="label">Plata</span>
      <span class="moneytxt" id="moneyTxt">$0</span>
    </div>
    <div class="stat">
      <span class="label">Nivel</span>
      <span class="lvltxt" id="lvlTxt">1 / 10</span>
    </div>
    <div class="stat">
      <span class="label">XP</span>
      <div class="barwrap"><div class="barfill" id="xpbar" style="width:0%"></div></div>
    </div>
    <div class="stat">
      <span class="label">Vida del muñeco</span>
      <div class="barwrap"><div class="barfill" id="hpbar" style="width:100%"></div></div>
    </div>
  </div>

  <div id="stage">
    <div id="windIndicator">💨 <span id="windTxt"></span></div>

    <div id="buddyWrap">
      <div class="sharkzone" id="sharkzone">
        <div class="fin" style="left:20px;"></div>
        <div class="fin" style="left:80px;bottom:10px;"></div>
        <div class="fin" style="left:140px;bottom:-4px;"></div>
      </div>
      <div class="trapdoor" id="trapdoor"></div>
      <div id="buddy">
        <div class="fan left" id="fanL"><div class="blade"></div></div>
        <div class="fan right" id="fanR"><div class="blade"></div></div>
        <div class="part legL"></div>
        <div class="part legR"></div>
        <div class="part armL"></div>
        <div class="part armR"></div>
        <div class="part torso" id="torso"></div>
        <div class="armorplate" id="armorplate"></div>
        <div class="part head" id="head"></div>
        <div class="helmet" id="helmet"></div>
      </div>
    </div>

    <div id="launcher">🤾</div>
    <div id="centerBanner"></div>

    <div id="train">
      <div id="trainRun">
        <div class="loco-nose"></div>
        <div class="loco-body"></div>
        <div class="loco-cabin"></div>
        <div class="loco-chimney"></div>
        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
        <div class="wheel w3"></div>
        <div class="wheel w4"></div>
      </div>
    </div>
  </div>

  <div id="shop"></div>
</div>

<button id="secretBtn" title=""></button>

  document.documentElement.style.setProperty('--avatar-img', 'url("data:image/jpeg;base64,'+AVATAR_B64+'")');

  /* ================= CONFIG ================= */
  const WEAPONS = {
    tomate:      {name:"Tomate",       emoji:"🍅", dmg:9,   price:0,    cooldown:450},
    martillo:    {name:"Martillo",     emoji:"🔨", dmg:16,  price:60,   cooldown:500},
    hacha:       {name:"Hacha",        emoji:"🪓", dmg:23,  price:140,  cooldown:550},
    bate:        {name:"Bate c/clavos",emoji:"🏏", dmg:31,  price:280,  cooldown:550},
    pistola:     {name:"Pistola",      emoji:"🔫", dmg:40,  price:520,  cooldown:400},
    motosierra:  {name:"Motosierra",   emoji:"🪚", dmg:55,  price:950,  cooldown:600},
    lanzallamas: {name:"Lanzallamas",  emoji:"🔥", dmg:70,  price:1600, cooldown:500},
    escopeta:    {name:"Escopeta",     emoji:"💥", dmg:86,  price:2400, cooldown:650},
    dinamita:    {name:"Dinamita",     emoji:"🧨", dmg:112, price:3400, cooldown:750},
    final:       {name:"Arma Final",   emoji:"🚀", dmg:150, price:5200, cooldown:700},
  };

  const LEVELS = [
    {lvl:1,  helmet:0, armor:0,   fans:0, dodge:false, trap:false, weapon:"tomate"},
    {lvl:2,  helmet:3, armor:0,   fans:0, dodge:false, trap:false, weapon:"martillo"},
    {lvl:3,  helmet:3, armor:0,   fans:1, dodge:false, trap:false, weapon:"hacha"},
    {lvl:4,  helmet:3, armor:.30, fans:1, dodge:false, trap:false, weapon:"bate"},
    {lvl:5,  helmet:4, armor:.30, fans:1, dodge:false, trap:true,  weapon:"pistola"},
    {lvl:6,  helmet:5, armor:.40, fans:1, dodge:false, trap:true,  weapon:"motosierra"},
    {lvl:7,  helmet:5, armor:.40, fans:2, dodge:false, trap:true,  weapon:"lanzallamas"},
    {lvl:8,  helmet:5, armor:.50, fans:2, dodge:true,  trap:true,  weapon:"escopeta"},
    {lvl:9,  helmet:6, armor:.60, fans:2, dodge:true,  trap:true,  weapon:"dinamita"},
    {lvl:10, helmet:8, armor:.70, fans:2, dodge:true,  trap:true,  weapon:"final", boss:true},
  ];

  const PHRASES = {
    hit:   ["¡Le encantó eso!","Pidió más","Ni se inmutó, raro...","Sonrió un poco, preocupante","Gimió de gusto, qué asco"],
    crit:  ["¡DIRECTO A LA CABEZA Y SONRIÓ!","Le gustó demasiado ese","¡CRÍTICO! Casi da las gracias","Puso cara de placer, qué cuático"],
    miss:  ["Falló... el muñeco casi se ofende","Ni cerca, y eso que quería que le pegaran","Esquivó por pura mala suerte tuya","El viento lo salvó esta vez"],
    kill:  ["Murió feliz","Pidió una vuelta más antes de irse","Cayó con una sonrisa, en serio","Se desmayó de la emoción"],
    trap:  ["¡CAYÓ A LA FOSA Y LE ENCANTÓ!","Los tiburones también lo consintieron","Bajó pidiendo bis"],
    levelup:["Volvió más masoquista que antes","Subió de nivel, ahora aguanta más castigo","Se preparó mejor para sufrir"],
  };

  const STORAGE_KEY = "kickbuddy_save_v1";

  /* ================= STATE ================= */
  let state = {
    money: 0,
    level: 1,
    xp: 0,
    hp: 100,
    maxHp: 100,
    weapon: "tomate",
    owned: ["tomate"],
  };

  let windOffset = 0;   // px de desvío actual
  let fansActive = 0;
  let helmetHp = 0;
  let lastShot = 0;
  let paused = false;
  let dodgeTimer = null;

  /* ================= DOM ================= */
  const $ = id => document.getElementById(id);
  const stage = $("stage");
  const buddyWrap = $("buddyWrap");
  const head = $("head");
  const torso = $("torso");
  const helmetEl = $("helmet");
  const armorEl = $("armorplate");
  const fanL = $("fanL"), fanR = $("fanR");
  const trapdoor = $("trapdoor");
  const sharkzone = $("sharkzone");
  const launcher = $("launcher");
  const centerBanner = $("centerBanner");
  const windIndicator = $("windIndicator");
  const windTxt = $("windTxt");
  const shopEl = $("shop");
  const moneyTxt = $("moneyTxt");
  const lvlTxt = $("lvlTxt");
  const xpbar = $("xpbar");
  const hpbar = $("hpbar");
  const secretBtn = $("secretBtn");
  const trainEl = $("train");

  function levelConf(l){ return LEVELS[Math.min(l,10)-1]; }

  /* ================= SAVE / LOAD ================= */
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const s = JSON.parse(raw);
        state = Object.assign(state, s);
      }
    }catch(e){}
  }

  /* ================= INIT LEVEL VISUALS ================= */
  function xpNeeded(l){ return l*180; }

  function applyLevelVisuals(){
    const conf = levelConf(state.level);
    helmetHp = conf.helmet;
    helmetEl.style.display = conf.helmet>0 ? "block":"none";
    armorEl.style.display = conf.armor>0 ? "block":"none";
    fansActive = conf.fans;
    fanL.style.display = conf.fans>=1 ? "block":"none";
    fanR.style.display = conf.fans>=2 ? "block":"none";
    trapdoor.style.transform = "rotateX(0deg)";
    sharkzone.style.display = "none";
    buddyWrap.classList.remove("flyaway","sink","squash");
    buddyWrap.style.opacity = 1;
    buddyWrap.style.left = "50%";

    if(dodgeTimer){ clearInterval(dodgeTimer); dodgeTimer=null; }
    if(conf.dodge){
      dodgeTimer = setInterval(()=>{
        if(paused) return;
        const shift = (Math.random()*60-30);
        buddyWrap.style.transform = `translateX(calc(-50% + ${shift}px))`;
      }, 1400);
    } else {
      buddyWrap.style.transform = "translateX(-50%)";
    }
  }

  function refreshHud(){
    moneyTxt.textContent = "$"+state.money;
    lvlTxt.textContent = state.level+" / 10";
    const need = xpNeeded(state.level);
    xpbar.style.width = Math.min(100,(state.xp/need)*100)+"%";
    hpbar.style.width = Math.max(0,(state.hp/state.maxHp)*100)+"%";
  }

  /* ================= SHOP ================= */
  function renderShop(){
    shopEl.innerHTML = "";
    Object.keys(WEAPONS).forEach(id=>{
      const w = WEAPONS[id];
      const unlockLevel = LEVELS.find(l=>l.weapon===id).lvl;
      const owned = state.owned.includes(id);
      const lockedByLevel = state.level < unlockLevel;
      const card = document.createElement("div");
      card.className = "wcard"+(state.weapon===id?" selected":"")+(lockedByLevel?" locked":"");
      card.innerHTML = `
        <div class="wemoji">${w.emoji}</div>
        <div class="wname">${w.name}</div>
        ${lockedByLevel ? `<div class="wlock">Nivel ${unlockLevel}</div>` :
          owned ? `<div class="wprice">Equipado</div>` : `<div class="wprice">$${w.price}</div>`}
      `;
      card.addEventListener("click", ()=>{
        if(lockedByLevel){ toast(stagePoint(50,50), `Necesitas nivel ${unlockLevel}`, "miss"); return; }
        if(owned){ state.weapon = id; renderShop(); save(); return; }
        if(state.money >= w.price){
          state.money -= w.price;
          state.owned.push(id);
          state.weapon = id;
          refreshHud(); renderShop(); save();
        } else {
          toast(stagePoint(50,50), "Te falta plata", "miss");
        }
      });
      shopEl.appendChild(card);
    });
  }

  function stagePoint(px,py){
    const r = stage.getBoundingClientRect();
    return {x:r.left+px, y:r.top+py};
  }

  /* ================= TOAST ================= */
  function toast(pos, text, kind){
    const t = document.createElement("div");
    t.className = "toast"+(kind==="crit"?" crit":kind==="miss"?" miss":"");
    t.textContent = text;
    const r = stage.getBoundingClientRect();
    t.style.left = Math.max(4,Math.min(r.width-160,pos.x-r.left-20))+"px";
    t.style.top = Math.max(4,pos.y-r.top-30)+"px";
    stage.appendChild(t);
    setTimeout(()=>t.remove(), 1300);
  }
  function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  /* ================= WIND ================= */
  function rollWind(){
    if(fansActive<=0){ windOffset = 0; windIndicator.style.display="none"; return; }
    const strength = fansActive===1 ? (60+Math.random()*50) : (90+Math.random()*70);
    const dir = Math.random()<0.5 ? -1:1;
    windOffset = strength*dir;
    windIndicator.style.display = "flex";
    windTxt.textContent = `Viento ${dir<0?"← empuja izquierda":"empuja derecha →"} (compensa ${dir<0?"a la derecha":"a la izquierda"})`;
  }

  /* ================= SHOOTING ================= */
  stage.addEventListener("click", (e)=>{
    if(paused) return;
    const now = performance.now();
    const w = WEAPONS[state.weapon];
    if(now - lastShot < w.cooldown) return;
    lastShot = now;

    const stageRect = stage.getBoundingClientRect();
    const clickX = e.clientX;
    const clickY = e.clientY;
    const targetX = clickX + windOffset;
    const targetY = clickY;

    const startX = stageRect.left + stageRect.width/2;
    const startY = stageRect.bottom - stageRect.height*0.06;

    throwProjectile(w, startX, startY, targetX, targetY, ()=>{
      resolveHit(targetX, targetY);
      rollWind();
    });
  });

  function throwProjectile(w, sx, sy, tx, ty, onLand){
    const el = document.createElement("div");
    el.className = "projectile";
    el.textContent = w.emoji;
    document.body.appendChild(el);
    const duration = 550;
    const arcHeight = 160 + Math.random()*40;
    const start = performance.now();

    function frame(now){
      let t = (now-start)/duration;
      if(t>1) t=1;
      const x = sx + (tx-sx)*t;
      const y = sy + (ty-sy)*t - arcHeight*Math.sin(Math.PI*t);
      el.style.left = x+"px";
      el.style.top = y+"px";
      el.style.transform = `rotate(${t*480}deg)`;
      if(t<1){
        requestAnimationFrame(frame);
      } else {
        el.remove();
        onLand();
      }
    }
    requestAnimationFrame(frame);
  }

  /* ================= HIT DETECTION ================= */
  function pointInRect(x,y,rect){
    return x>=rect.left && x<=rect.right && y>=rect.top && y<=rect.bottom;
  }

  function resolveHit(x,y){
    const conf = levelConf(state.level);
    const w = WEAPONS[state.weapon];

    const headR = head.getBoundingClientRect();
    const torsoR = torso.getBoundingClientRect();
    const armLR = document.querySelector(".armL").getBoundingClientRect();
    const armRR = document.querySelector(".armR").getBoundingClientRect();
    const legLR = document.querySelector(".legL").getBoundingClientRect();
    const legRR = document.querySelector(".legR").getBoundingClientRect();

    let zone = null;
    if(pointInRect(x,y,headR)) zone="head";
    else if(pointInRect(x,y,torsoR)) zone="torso";
    else if(pointInRect(x,y,armLR)||pointInRect(x,y,armRR)||pointInRect(x,y,legLR)||pointInRect(x,y,legRR)) zone="limb";

    if(!zone){
      toast({x,y}, rand(PHRASES.miss), "miss");
      return;
    }

    let dmg = w.dmg;
    let crit = false;

    if(zone==="head"){
      if(helmetHp>0){
        helmetHp -= 1;
        dmg = Math.round(dmg*0.35);
        if(helmetHp<=0){ helmetEl.style.display="none"; }
      } else {
        dmg = Math.round(dmg*2);
        crit = true;
      }
    } else if(zone==="torso"){
      dmg = Math.round(dmg*(1-conf.armor));
    } else if(zone==="limb"){
      dmg = Math.round(dmg*0.5*(1-conf.armor*0.5));
    }

    // flash de golpe
    buddyWrap.classList.add("hitflash");
    setTimeout(()=>buddyWrap.classList.remove("hitflash"),90);

    const earned = Math.max(1, Math.round(dmg*0.9));
    state.money += earned;
    state.hp -= dmg;

    toast({x,y}, `${crit?"¡CRÍTICO! ":""}-${dmg} · +$${earned}`, crit?"crit":"hit");
    setTimeout(()=>toast({x:x+ (Math.random()*40-20), y:y-20}, rand(crit?PHRASES.crit:PHRASES.hit), crit?"crit":"hit"), 250);

    // trampa random
    if(conf.trap && state.hp>0 && Math.random() < 0.09){
      refreshHud(); save();
      triggerTrap();
      return;
    }

    if(state.hp<=0){
      refreshHud(); save();
      handleKill();
      return;
    }

    refreshHud();
    save();
  }

  /* ================= TRAP (FOSA DE TIBURONES) ================= */
  function triggerTrap(){
    paused = true;
    sharkzone.style.display = "block";
    trapdoor.style.transition = "transform .35s ease";
    trapdoor.style.transform = "rotateX(80deg)";
    buddyWrap.classList.add("sink");
    toast(stagePoint(110,60), rand(PHRASES.trap), "crit");
    showBanner("🦈 ¡FOSA DE TIBURONES! 🦈","Consintieron a su presa");
    setTimeout(()=>{
      finishKill(true);
      buddyWrap.classList.remove("sink");
      sharkzone.style.display = "none";
      trapdoor.style.transform = "rotateX(0deg)";
      hideBanner();
      paused = false;
    }, 1600);
  }

  function handleKill(){
    paused = true;
    buddyWrap.classList.add("flyaway");
    toast(stagePoint(110,60), rand(PHRASES.kill), "crit");
    setTimeout(()=>{
      finishKill(false);
      buddyWrap.classList.remove("flyaway");
      paused = false;
    }, 650);
  }

  function finishKill(fromTrap){
    const bonus = fromTrap ? 40+state.level*10 : 0;
    state.money += bonus;
    const xpGain = 80 + state.level*15;
    state.xp += xpGain;
    const need = xpNeeded(state.level);

    if(state.xp >= need && state.level < 10){
      state.xp -= need;
      state.level += 1;
      const conf = levelConf(state.level);
      const newWeaponId = conf.weapon;
      if(!state.owned.includes(newWeaponId)){
        // se desbloquea en tienda, no se regala
      }
      applyLevelVisuals();
      renderShop();
      showBanner(`⬆️ NIVEL ${state.level}`, rand(PHRASES.levelup));
      setTimeout(hideBanner, 1500);
    } else if(state.level>=10){
      state.xp = need; // tope visual
      showBanner("🏆 JEFE VENCIDO 🏆","Completaste el castigo. Puedes seguir jugando igual.");
      setTimeout(hideBanner, 1800);
    }

    state.hp = state.maxHp = 100 + (state.level-1)*40;
    state.hp = state.maxHp;
    refreshHud();
    save();
  }

  function showBanner(main, sub){
    centerBanner.innerHTML = `${main}<span class="sub">${sub||""}</span>`;
    centerBanner.style.display = "block";
  }
  function hideBanner(){ centerBanner.style.display = "none"; }

  /* ================= EASTER EGG: TREN ================= */
  function playHorn(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const notes = [440, 330];
      notes.forEach((freq, i)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime + i*0.35);
        gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + i*0.35 + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.35 + 0.55);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + i*0.35);
        osc.stop(ctx.currentTime + i*0.35 + 0.6);
      });
    }catch(e){}
  }

  secretBtn.addEventListener("click", ()=>{
    if(paused) return;
    paused = true;
    playHorn();
    trainEl.style.display = "block";
    trainEl.querySelector("#trainRun").style.animation = "none";
    void trainEl.offsetWidth;
    trainEl.querySelector("#trainRun").style.animation = "";
    showBanner("🚂 ¡TODOS A BORDO DEL DOLOR! 🚂","");

    setTimeout(()=>{
      buddyWrap.classList.add("squash");
    }, 1050);
    setTimeout(()=>{
      buddyWrap.classList.remove("squash");
    }, 1550);
    setTimeout(()=>{
      trainEl.style.display = "none";
      hideBanner();
      paused = false;
    }, 2700);
  });

  /* ================= INIT ================= */
  function init(){
    load();
    state.maxHp = 100 + (state.level-1)*40;
    if(state.hp<=0 || state.hp>state.maxHp) state.hp = state.maxHp;
    applyLevelVisuals();
    renderShop();
    refreshHud();
    rollWind();
  }

  init();
})();
</script>
